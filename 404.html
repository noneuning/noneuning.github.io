<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9">
<meta name="robots" content="noindex">

<!-- Inline SVG favicon — brand circle with a white "n". No external file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='16'%20fill='%23FF6B35'/%3E%3Ctext%20x='16'%20y='23.5'%20font-family='Arial,Helvetica,sans-serif'%20font-size='22'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3En%3C/text%3E%3C/svg%3E">

<title>Page not found — noneun</title>
<style>
/* Same tokens as index.html, trimmed to what this page uses. */
:root {
  --bg:        #FFFDF9;
  --ink:       #1A1A1A;
  --ink-soft:  #5A5A5A;
  --brand:     #FF6B35;
  --brand-2:   #7C5CFF;
  --radius:    12px;
  --maxw:      680px;
  --pad:       20px;

  --brand-ink: #C2410C;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;

  --fs-h1:   32px;
  --fs-body: 16px;
  --lh-tight: 1.2;
  --lh-body:  1.65;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body, h1, p { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  min-height: 100vh;
  display: flex;
  align-items: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

.wrap {
  width: 100%;
  max-width: var(--maxw);
  margin-inline: auto;
  padding: 64px var(--pad);
}

h1 {
  font-size: var(--fs-h1);
  line-height: var(--lh-tight);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin-bottom: 16px;
}

.lead { color: var(--ink-soft); }

.back {
  display: inline-block;
  margin-top: 28px;
  padding: 16px 26px;
  background: var(--brand);
  color: var(--ink);          /* ink on brand = 6.1:1 */
  font-weight: 700;
  text-decoration: none;
  border-radius: var(--radius);
  border: 1px solid rgba(0,0,0,.08);
}
.back:hover { filter: brightness(1.05); }
.back:active { transform: translateY(1px); }

:focus-visible {
  outline: 3px solid var(--brand-2);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (min-width: 700px) {
  :root { --fs-h1: 44px; --fs-body: 17px; --pad: 24px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

  <main class="wrap">
    <h1>This page took a wrong exit.</h1>
    <p class="lead">Happens in Seoul too. Here's the way back.</p>
    <a class="back" href="/"><span aria-hidden="true">→</span> Back to the guide</a>
  </main>

</body>
</html>
